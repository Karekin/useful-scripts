name: CloudMold data contracts CI

on:
  push:
    branches:
      - dev-3.x
      - cloudmold/main
    paths:
      - yml/yshopping-lakehouse/**
      - .github/workflows/cloudmold-data-ci.yml
  pull_request:
    paths:
      - yml/yshopping-lakehouse/**
      - .github/workflows/cloudmold-data-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudmold-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yml/yshopping-lakehouse
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run contract and manifest unit tests
        run: python -m unittest discover -s tests/python -p 'test_*.py'

      - name: Validate all event contracts
        run: ./scripts/contractctl validate

      - name: Validate model application order
        run: ./scripts/modelctl validate

      - name: Validate the Compose model without starting services
        env:
          CDC_MYSQL_USER: ci-only
          CDC_MYSQL_PASSWORD: ci-only
          STARROCKS_USER: root
          STARROCKS_PASSWORD: ''
        run: docker compose config --quiet
