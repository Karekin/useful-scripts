name: canonical-listing-fulfillment-commerce
version: 2
owner: CloudMold
scope: governed-listing-order-payment-fulfillment-return

identity:
  tenant_key: tenant_id
  listing_key: [tenant_id, listing_id]
  order_key: [tenant_id, order_id]
  fulfillment_key: [tenant_id, fulfillment_id]
  reservation_link: [tenant_id, order_id, order_item_id, reservation_id]

events:
  listing.status.changed:
    schema_version: 1
    happy_path_count: 6
    versions: [1, 2, 3, 4, 5, 6]
    terminal_status: PUBLISHED
  listing.review.decided:
    schema_version: 1
    happy_path_count: 3
    stages: [COMPLETION, BUSINESS, RISK]
    terminal_decision: PASSED
  order.status.changed:
    schema_version: 2
    happy_path_count: 7
    terminal_status: RETURNED
    reserved_cancellation_count: 3
    cancellation_terminal_status: CANCELLED
  payment.status.changed:
    schema_version: 1
    happy_path_count: 2
    terminal_status: REFUNDED
  fulfillment.status.changed:
    schema_version: 1
    happy_path_count: 4
    versions: [1, 2, 3, 4]
    terminal_status: DELIVERED
  inventory.stock.changed:
    schema_version: 1
    happy_path_count: 4
    happy_path_movements: [PURCHASE_RECEIPT, RESERVATION, SALE_SHIPMENT, SALE_RETURN]
    reserved_cancellation_count: 3
    cancellation_movements: [PURCHASE_RECEIPT, RESERVATION, RESERVATION_RELEASE]

exact_links:
  - order v2 item must match the PUBLISHED Listing offer at listing_id, listing_offer_id, listing_revision and listing_version
  - SKU, unit price, currency, channel and shop must equal the immutable Listing snapshot
  - fulfillment item must equal order item by order_item_id, canonical_sku_id, quantity and reservation_id
  - SALE_SHIPMENT or RESERVATION_RELEASE must use the same order_id, order_item_id and reservation_id
  - order shipment references must equal the DELIVERED fulfillment and shipment
  - shipped_at must not exceed in_transit_at or delivered_at
  - order SHIPPED and COMPLETED events must not precede fulfillment shipment and delivery

happy_path_acceptance:
  public_command_count: 23
  public_command_replay_duplicates: 23
  slice_outbox_count_without_catalog: 26
  catalog_outbox_count: 16
  full_vertical_outbox_count: 42
  payable_captured_refunded: equal
  final_inventory: {on_hand: 10, reserved: 0, available: 10, version: 4}
  ads_readiness: RECONCILED

reserved_cancellation_acceptance:
  public_command_count: 12
  public_command_replay_duplicates: 12
  slice_outbox_count_without_catalog: 15
  payment_absent: true
  fulfillment_absent: true
  final_inventory: {on_hand: 10, reserved: 0, available: 10, version: 3}

replay_policy:
  stable_event_id: true
  no_new_operation_rows: true
  no_new_outbox_rows: true
  duplicate_business_result: true

relay_policy:
  published_status_code: 20
  excluded_status_codes: [0, 10, 30]
  readiness_requires_relay_confirmation: true

known_limits:
  - first slice supports one complete fulfillment for the entire order
  - first slice uses INTERNAL_TEST payment and carrier providers
  - Listing current dimensions are not SCD2; immutable order links are checked against event-grain Listing snapshots
  - the TEST_FIXTURE receipt is deterministic scenario stock, not procurement authority
