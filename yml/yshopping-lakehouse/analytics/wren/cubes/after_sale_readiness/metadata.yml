name: after_sale_readiness_cube
base_object: after_sale_readiness
measures:
  - {name: case_count, expression: "COUNT(DISTINCT after_sale_id)", type: BIGINT}
  - {name: reconciled_rate, expression: "100.0 * SUM(CASE WHEN readiness_status = 'RECONCILED' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)", type: DOUBLE}
  - {name: recovery_required_count, expression: "SUM(CASE WHEN recovery_status IN ('REQUIRED','PENDING') THEN 1 ELSE 0 END)", type: BIGINT}
  - {name: refunded_amount_yuan, expression: "SUM(refunded_amount_minor) / 100.0", type: DOUBLE}
dimensions:
  - {name: tenant_id, expression: tenant_id, type: BIGINT}
  - {name: run_id, expression: run_id, type: VARCHAR}
  - {name: readiness_status, expression: readiness_status, type: VARCHAR}
  - {name: recovery_status, expression: recovery_status, type: VARCHAR}
  - {name: responsibility, expression: responsibility, type: VARCHAR}
  - {name: warehouse_id, expression: warehouse_id, type: VARCHAR}
  - {name: currency_code, expression: currency_code, type: VARCHAR}
time_dimensions:
  - {name: data_freshness_at, expression: data_freshness_at, type: TIMESTAMP}
