source:
  type: mysql
  hostname: yudao-mysql
  port: 3306
  username: "${CDC_MYSQL_USER}"
  password: "${CDC_MYSQL_PASSWORD}"
  tables: ruoyi-vue-pro.product_(spu|sku|category|brand|property|property_value)
  server-id: 5500-5504
  server-time-zone: Asia/Shanghai

sink:
  type: starrocks
  name: Y Shopping Catalog ODS
  jdbc-url: jdbc:mysql://starrocks:9030
  load-url: starrocks:8030
  username: "${STARROCKS_USER}"
  password: "${STARROCKS_PASSWORD}"
  table.create.properties.replication_num: 1

route:
  - source-table: ruoyi-vue-pro.product_(spu|sku|category|brand|property|property_value)
    sink-table: yshopping_ods.<>
    replace-symbol: <>
    description: Route the Mall catalog authority into the Y Shopping ODS database

pipeline:
  name: Y Shopping Catalog MySQL to StarRocks ODS
  parallelism: ${FLINK_PARALLELISM}
  schema.change.behavior: EVOLVE
