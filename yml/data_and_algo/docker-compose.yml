version: "3.8"

# ============================================================================
# Git-Sync 机制配置说明
# ============================================================================
# 本 compose 文件实现了「以 Git 为单一事实源」的协作平台架构：
#
# 1. token-fetcher: 周期性生成 GitHub App Installation Token (50min刷新)
# 2. git-sync: 使用 token 同步私有仓库到 codebase_volume
# 3. 各服务 (Airflow/Spark/Flink) 从 codebase_volume:/code 只读挂载
#
# 仓库目录结构约定：
#   /code/airflow/dags   - Airflow DAGs
#   /code/airflow/jobs   - Python 脚本
#   /code/dbt            - dbt project
#   /code/flink/sql      - Flink SQL
#   /code/flink/udf      - Flink UDF jars
#   /code/python         - Python scripts
#   /code/notebooks      - Jupyter notebooks
# ============================================================================

services:
  # ==========================================================================
  # Git Sync 基础设施
  # ==========================================================================

  # ---------- Token Fetcher: 生成 GitHub Installation Token ----------
  token-fetcher:
    build:
      context: ./token-fetcher
      dockerfile: Dockerfile
    container_name: token-fetcher
    # restart: unless-stopped
    environment:
      - GITHUB_APP_ID=2505691
      - GITHUB_INSTALLATION_ID=100416609
      - PRIVATE_KEY_PATH=/run/secrets/github_app_private_key
      - TOKEN_OUTPUT_PATH=/run/git-token/token
      - REFRESH_INTERVAL_SECONDS=3000 # 50 minutes
    secrets:
      - github_app_private_key
    volumes:
      - git_token_volume:/run/git-token
    networks:
      amoro_network:
    healthcheck:
      test: ["CMD", "test", "-f", "/run/git-token/token"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------- Git Sync: 同步私有仓库到共享卷 ----------
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    container_name: git-sync
    user: "0:0" # Run as root to avoid permission issues
    restart: unless-stopped
    depends_on:
      token-fetcher:
        condition: service_healthy
    environment:
      # 仓库配置
      - GITSYNC_REPO=https://github.com/CloudMold/data-ml-platform-assets.git
      - GITSYNC_REF=master
      - GITSYNC_ROOT=/code
      - GITSYNC_LINK=current
      # 同步间隔 (秒)
      - GITSYNC_PERIOD=30s
      # Token 文件路径 (由 token-fetcher 写入)
      - GITSYNC_USERNAME=x-access-token
      - GITSYNC_PASSWORD_FILE=/run/git-token/token
      # 其他配置
      - GITSYNC_ONE_TIME=false
      - GITSYNC_DEPTH=1
      - GITSYNC_ADD_USER=true
      - GITSYNC_MAX_FAILURES=10
    volumes:
      - codebase_volume:/code
      - git_token_volume:/run/git-token:ro
    networks:
      amoro_network:
    healthcheck:
      test: ["CMD", "test", "-L", "/code/current"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # 对象存储 & 数据湖
  # ==========================================================================

  # ---------- 对象存储：MinIO ----------
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      amoro_network:
        aliases:
          - warehouse.minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  # ---------- MinIO 初始化工具：mc ----------
  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      - minio
    networks:
      amoro_network:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do
        echo '...waiting for minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/warehouse || true;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

  # ---------- Lakehouse 管理：Amoro (Unified Catalog) ----------
  amoro:
    image: apache/amoro
    container_name: amoro
    depends_on:
      - minio
    ports:
      - "8081:8081" # Amoro Web UI
      - "1630:1630" # Optimizer Dashboard / REST API
      - "1260:1260" # RPC / Client 端口
    environment:
      - JVM_XMS=1024
    networks:
      amoro_network:
    volumes:
      - ./amoro-meta:/tmp/amoro
    command: ["/entrypoint.sh", "ams"]
    tty: true
    stdin_open: true

  # ==========================================================================
  # 业务数据库
  # ==========================================================================

  # ---------- 业务数据库：MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=mydb
      - MYSQL_ROOT_HOST=%
    networks:
      amoro_network:
    ports:
      - "3306:3306"

  # ==========================================================================
  # 实时计算：Flink
  # ==========================================================================

  # ---------- 实时计算：Flink JobManager (Custom Image) ----------
  flink-jobmanager:
    build:
      context: ./flink-cluster
      dockerfile: Dockerfile
    image: custom-flink:1.20.3-iceberg
    container_name: flink-jobmanager
    depends_on:
      git-sync:
        condition: service_healthy
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: s3://warehouse/flink/checkpoints
        state.savepoints.dir: s3://warehouse/flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: admin
        s3.secret-key: password
        s3.endpoint.region: us-east-1
    volumes:
      # Git-sync codebase (read-only)
      - codebase_volume:/code:ro
      # 额外 JAR 包目录 (挂载本地目录到 lib 以便动态添加依赖)
      - ./flink-libs:/opt/flink/lib/extra:ro
    networks:
      amoro_network:

  # ---------- 实时计算：Flink TaskManager (Custom Image) ----------
  flink-taskmanager:
    image: custom-flink:1.20.3-iceberg
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: s3://warehouse/flink/checkpoints
        state.savepoints.dir: s3://warehouse/flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: admin
        s3.secret-key: password
        s3.endpoint.region: us-east-1
    volumes:
      # Git-sync codebase (read-only)
      - codebase_volume:/code:ro
      # 额外 JAR 包目录 (挂载本地目录到 lib 以便动态添加依赖)
      - ./flink-libs:/opt/flink/lib/extra:ro
    networks:
      amoro_network:

  # ==========================================================================
  # 分析 & 查询引擎
  # ==========================================================================

  # ---------- 分析引擎：StarRocks (All-in-One) ----------
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: starrocks
    ports:
      - "8030:8030" # FE HTTP
      - "9020:9020" # FE RPC
      - "9030:9030" # FE MySQL
      - "8040:8040" # BE HTTP
    networks:
      amoro_network:

  # ---------- 查询引擎：Trino ----------
  trino:
    image: trinodb/trino:419
    container_name: trino
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./trino-conf/amoro_catalog.properties:/etc/trino/catalog/amoro_catalog.properties
    networks:
      amoro_network:
        aliases:
          - warehouse.trino
    ports:
      - "8080:8080"
    depends_on:
      - amoro

  # ==========================================================================
  # 服务接口
  # ==========================================================================

  # ---------- 服务接口：API ----------
  api:
    build: ./api
    container_name: web-api
    ports:
      - "8000:8000"
    networks:
      amoro_network:
    depends_on:
      - trino
      - starrocks

  # ==========================================================================
  # 计算 & ML
  # ==========================================================================

  # ---------- 计算：Spark（Iceberg-ready） ----------
  spark:
    image: tabulario/spark-iceberg
    container_name: spark
    depends_on:
      minio:
        condition: service_started
      amoro:
        condition: service_started
      git-sync:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888" # Jupyter Notebook
      - "4040:4040" # Spark Web UI（第一个应用）
    volumes:
      # Spark 配置
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      # Git-sync codebase (read-only)
      - codebase_volume:/code:ro

  # ---------- 实验管理：MLflow ----------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    depends_on:
      - minio
    networks:
      amoro_network:
    environment:
      # 告诉 MLflow 使用 MinIO 作为 S3 Artifact Store
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "5001:5000" # MLflow Tracking UI
    volumes:
      # 本地持久化 MLflow 元数据（SQLite + mlruns）
      - ./mlflow:/mlflow
    working_dir: /mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://warehouse/mlflow
      --host 0.0.0.0
      --port 5000

  # ==========================================================================
  # 工作流编排：Airflow
  # ==========================================================================

  # ---------- Airflow 元数据库 ----------
  airflow-postgres:
    image: postgres:14
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      amoro_network:
    volumes:
      - ./airflow/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Airflow 初始化
  airflow-init:
    build:
      context: ./airflow
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      git-sync:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
      # DAGs 路径指向 git-sync 共享卷
      AIRFLOW__CORE__DAGS_FOLDER: /code/current/airflow/dags
      # 添加 Python 路径以支持自定义模块导入
      PYTHONPATH: /code/current/airflow
    volumes:
      # Git-sync codebase (read-only for dags/jobs/plugins)
      - codebase_volume:/code:ro
      # Logs 仍然使用本地卷 (需要写入)
      - ./airflow/logs:/opt/airflow/logs
    entrypoint: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com;
      echo 'Airflow init done';
      "

  airflow-webserver:
    build:
      context: ./airflow
    container_name: airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
      git-sync:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
      # DAGs 路径指向 git-sync 共享卷
      AIRFLOW__CORE__DAGS_FOLDER: /code/current/airflow/dags
      # 添加 Python 路径以支持自定义模块导入
      PYTHONPATH: /code/current/airflow
    volumes:
      # Git-sync codebase (read-only for dags/jobs/plugins)
      - codebase_volume:/code:ro
      # Logs 仍然使用本地卷 (需要写入)
      - ./airflow/logs:/opt/airflow/logs
    command: webserver
    ports:
      - "8082:8080" # Airflow Web UI

  airflow-scheduler:
    build:
      context: ./airflow
    user: "0:0"
    container_name: airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      git-sync:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
      # DAGs 路径指向 git-sync 共享卷
      AIRFLOW__CORE__DAGS_FOLDER: /code/current/airflow/dags
      # 添加 Python 路径以支持自定义模块导入
      PYTHONPATH: /code/current/airflow
    volumes:
      # Docker socket for DockerOperator
      - /var/run/docker.sock:/var/run/docker.sock
      # Git-sync codebase (read-only for dags/jobs/plugins)
      - codebase_volume:/code:ro
      # Logs 仍然使用本地卷 (需要写入)
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler

# ============================================================================
# Networks
# ============================================================================
networks:
  amoro_network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  # MinIO 数据持久化
  minio_data:

  # Git-sync 代码库共享卷
  # 所有服务从这里读取代码资产
  codebase_volume:

  # GitHub Token 共享卷
  # token-fetcher 写入，git-sync 读取
  git_token_volume:

# ============================================================================
# Secrets (Docker Compose Secrets)
# ============================================================================
secrets:
  github_app_private_key:
    file: ./secrets/cloudmold-git-sync.2025-12-19.private-key.pem
