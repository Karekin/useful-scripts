version: "3"

services:
  # ---------- 对象存储：MinIO ----------
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      amoro_network:
        aliases:
          - warehouse.minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  # ---------- MinIO 初始化工具：mc ----------
  mc:
    image: minio/mc
    container_name: mc
    depends_on:
      - minio
    networks:
      amoro_network:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do
        echo '...waiting for minio...' && sleep 1;
      done;
      # /usr/bin/mc rm -r --force minio/warehouse || true;
      /usr/bin/mc mb minio/warehouse || true;
      /usr/bin/mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

  # ---------- Lakehouse 管理：Amoro (Unified Catalog) ----------
  amoro:
    image: apache/amoro
    container_name: amoro
    depends_on:
      - minio
    ports:
      - "8081:8081" # Amoro Web UI
      - "1630:1630" # Optimizer Dashboard / REST API
      - "1260:1260" # RPC / Client 端口
    environment:
      - JVM_XMS=1024
    networks:
      amoro_network:
    volumes:
      - ./amoro-meta:/tmp/amoro
    command: ["/entrypoint.sh", "ams"]
    tty: true
    stdin_open: true

  # ---------- 业务数据库：MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=mydb
      - MYSQL_ROOT_HOST=%
    networks:
      amoro_network:
    ports:
      - "3306:3306"

  # ---------- 实时计算：Flink JobManager (Custom Image) ----------
  flink-jobmanager:
    build:
      context: ./flink-cluster
      dockerfile: Dockerfile
    image: custom-flink:1.20.3-iceberg
    container_name: flink-jobmanager
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: s3://warehouse/flink/checkpoints
        state.savepoints.dir: s3://warehouse/flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: admin
        s3.secret-key: password
        s3.endpoint.region: us-east-1
    networks:
      amoro_network:

  # ---------- 实时计算：Flink TaskManager (Custom Image) ----------
  flink-taskmanager:
    image: custom-flink:1.20.3-iceberg
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: s3://warehouse/flink/checkpoints
        state.savepoints.dir: s3://warehouse/flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: admin
        s3.secret-key: password
        s3.endpoint.region: us-east-1
    networks:
      amoro_network:

  # ---------- 分析引擎：StarRocks (All-in-One) ----------
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: starrocks
    ports:
      - "8030:8030" # FE HTTP
      - "9020:9020" # FE RPC
      - "9030:9030" # FE MySQL
      - "8040:8040" # BE HTTP
    networks:
      amoro_network:

  # ---------- 服务接口：API ----------
  api:
    build: ./api
    container_name: web-api
    ports:
      - "8000:8000"
    networks:
      amoro_network:
    depends_on:
      - trino
      - starrocks

  # ---------- 查询引擎：Trino ----------
  trino:
    image: trinodb/trino:419
    container_name: trino
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./trino-conf/amoro_catalog.properties:/etc/trino/catalog/amoro_catalog.properties
    networks:
      amoro_network:
        aliases:
          - warehouse.trino
    ports:
      - "8080:8080"
    depends_on:
      - amoro

  # ---------- 计算：Spark（Iceberg-ready） ----------
  spark:
    image: tabulario/spark-iceberg
    container_name: spark
    depends_on:
      - minio
      - amoro
    networks:
      amoro_network:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888" # Jupyter Notebook
      - "4040:4040" # Spark Web UI（第一个应用）
    volumes:
      # Spark 里的 Iceberg warehouse & notebooks
      # - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./airflow/jobs:/opt/jobs # ⭐ 新增：让 spark-submit 能看到脚本

  # ---------- 实验管理：MLflow ----------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    depends_on:
      - minio
    networks:
      amoro_network:
    environment:
      # 告诉 MLflow 使用 MinIO 作为 S3 Artifact Store
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "5001:5000" # MLflow Tracking UI
    volumes:
      # 本地持久化 MLflow 元数据（SQLite + mlruns）
      - ./mlflow:/mlflow
    working_dir: /mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://warehouse/mlflow
      --host 0.0.0.0
      --port 5000

  # ---------- Airflow 元数据库 ----------
  airflow-postgres:
    image: postgres:14
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      amoro_network:
    volumes:
      - ./airflow/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 公共 Airflow 环境变量
  airflow-init:
    build:
      context: ./airflow
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/jobs:/opt/airflow/jobs
    entrypoint: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com;
      echo 'Airflow init done';
      "

  airflow-webserver:
    build:
      context: ./airflow
    container_name: airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/jobs:/opt/airflow/jobs
    command: webserver
    ports:
      - "8082:8080" # Airflow Web UI

  airflow-scheduler:
    build:
      context: ./airflow
    user: "0:0"
    container_name: airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      amoro_network:
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "this_is_a_demo_fernet_key_change_me"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "this_is_a_demo_web_secret_change_me"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/jobs:/opt/airflow/jobs
    command: scheduler

networks:
  amoro_network:
    driver: bridge

volumes:
  minio_data:
