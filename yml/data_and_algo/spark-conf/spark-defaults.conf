# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Amoro Catalog - 名称需要与 Amoro UI 中创建的 Catalog 名称一致
spark.sql.catalog.amoro_catalog                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.amoro_catalog.type            rest
spark.sql.catalog.amoro_catalog.uri             http://amoro:1630/api/iceberg/rest
spark.sql.catalog.amoro_catalog.io-impl         org.apache.iceberg.aws.s3.S3FileIO
# warehouse 参数应为 Amoro 中的 Catalog 名称，不是 S3 路径
spark.sql.catalog.amoro_catalog.warehouse       amoro_catalog
spark.sql.catalog.amoro_catalog.s3.endpoint     http://minio:9000
spark.sql.defaultCatalog                        amoro_catalog
spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory


