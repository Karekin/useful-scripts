version: '3.8'
services:
  # 部署nacos，参考：https://www.cnblogs.com/studyjobs/p/18014237
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    ports:
      # web 界面访问端口
      - 8848:8848
      # 程序使用 grpc 连接的端口
      - 9848:9848
    environment:
      - MODE=standalone
    volumes:
      - ./data/nacos-single1/logs:/home/nacos/logs
