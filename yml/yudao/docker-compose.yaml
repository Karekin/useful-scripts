services:
  # 部署nacos，参考：https://www.cnblogs.com/studyjobs/p/18014237
  yudao-nacos:
    image: nacos/nacos-server:v2.5.3
    container_name: yudao-nacos
    restart: unless-stopped
    ports:
      # web 界面访问端口
      - 8848:8848
      # 程序使用 grpc 连接的端口
      - 9848:9848
      - 9849:9849
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    volumes:
      - ./data/nacos-single1/logs:/home/nacos/logs
    networks:
      - yudao_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  # Dubbo Admin is the HSF-console equivalent: a control plane for discovery,
  # metadata, governance and generic service testing. It is not a business provider.
  yudao-dubbo-admin:
    build:
      context: https://github.com/apache/dubbo-admin.git#b4c6cbfcc546d19fd19acda72c52a830941e2c6d
      # The upstream Dockerfile currently points at an amd64-only mirror. Keep
      # the upstream source pinned, but use official multi-arch build images.
      dockerfile_inline: |
        FROM node:18-alpine AS frontend-builder
        WORKDIR /ui-vue3
        COPY ui-vue3/package.json ui-vue3/yarn.lock ./
        RUN yarn install --frozen-lockfile
        COPY ui-vue3/ ./
        RUN yarn build

        FROM golang:1.24 AS builder
        ARG TARGETOS
        ARG TARGETARCH
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        COPY --from=frontend-builder /ui-vue3/dist app/dubbo-ui/dist
        RUN CGO_ENABLED=0 GOOS=$${TARGETOS:-linux} GOARCH=$${TARGETARCH:-amd64} \
            go build -a -o dubbo-admin ./app/dubbo-admin/main.go

        FROM alpine:3.20
        RUN addgroup -g 65532 app && adduser -D -u 65532 -G app app
        WORKDIR /app
        COPY --from=builder /app/dubbo-admin /app/dubbo-admin
        USER 65532:65532
        ENTRYPOINT ["./dubbo-admin"]
    image: cloudmold/dubbo-admin:b4c6cbfcc546
    container_name: yudao-dubbo-admin
    restart: unless-stopped
    depends_on:
      yudao-nacos:
        condition: service_healthy
    command: [ "run", "-c", "/etc/dubbo-admin/dubbo-admin.yaml" ]
    ports:
      - "127.0.0.1:38080:8888"
    volumes:
      - ./dubbo-admin.yaml:/etc/dubbo-admin/dubbo-admin.yaml:ro
      - ./data/dubbo-admin/logs:/app/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8888/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Provider data plane. It retains yudao as an upstream implementation and
  # exports only allowlisted CloudMold capability contracts over Dubbo.
  yudao-provider:
    build:
      context: ../../../yudao-cloud/yudao-server
    image: cloudmold/yudao-provider:local
    container_name: yudao-provider
    restart: unless-stopped
    depends_on:
      yudao-nacos:
        condition: service_healthy
      yudao-mysql:
        condition: service_healthy
      yudao-redis:
        condition: service_started
      temporal:
        condition: service_healthy
        required: false
      # Agent Control creates strict SkillTask RPC references when enabled.
      # With the agent profile active, wait for that external authority first;
      # without the profile this optional dependency stays out of the base stack.
      cloudmold-skill-task-executor:
        condition: service_healthy
        required: false
    command:
      - /bin/bash
      - -c
      - >-
        export CLOUDMOLD_RPC_SHARED_SECRET="$$(</run/secrets/cloudmold_rpc_shared_secret)";
        exec java $${JAVA_OPTS} -jar app.jar --spring.profiles.active=local
        --yudao.captcha.enable=$${YUDAO_CAPTCHA_ENABLE}
        --cloudmold.agent-control.enabled=$${CLOUDMOLD_AGENT_CONTROL_ENABLED}
        --cloudmold.agent-control.action-submission-enabled=$${CLOUDMOLD_AGENT_CONTROL_ACTION_SUBMISSION_ENABLED}
        --cloudmold.agent-control.runtime.enabled=$${CLOUDMOLD_AGENT_CONTROL_RUNTIME_ENABLED}
        --cloudmold.agent-control.runtime.legacy-erp-bridge-enabled=$${CLOUDMOLD_AGENT_CONTROL_RUNTIME_LEGACY_ERP_BRIDGE_ENABLED}
        --cloudmold.agent-control.approval-workflow.enabled=$${CLOUDMOLD_AGENT_APPROVAL_WORKFLOW_ENABLED}
        --cloudmold.ai-operations.temporal.enabled=$${CLOUDMOLD_AI_OPERATIONS_TEMPORAL_ENABLED}
    environment:
      CLOUDMOLD_RPC_ENABLED: "true"
      CLOUDMOLD_RPC_EXPORT_ENABLED: "true"
      CLOUDMOLD_RPC_READINESS_MARKER: /tmp/cloudmold-rpc-ready
      # Agent Control is fail-closed. Local/test operators must opt in to the
      # business-card API and each autonomous runtime separately.
      # Browser smoke tests run against this loopback-only demo stack.
      YUDAO_CAPTCHA_ENABLE: ${YUDAO_CAPTCHA_ENABLE:-false}
      CLOUDMOLD_AGENT_CONTROL_ENABLED: ${CLOUDMOLD_AGENT_CONTROL_ENABLED:-false}
      CLOUDMOLD_AGENT_CONTROL_ACTION_SUBMISSION_ENABLED: ${CLOUDMOLD_AGENT_CONTROL_ACTION_SUBMISSION_ENABLED:-false}
      CLOUDMOLD_AGENT_CONTROL_RUNTIME_ENABLED: ${CLOUDMOLD_AGENT_CONTROL_RUNTIME_ENABLED:-false}
      CLOUDMOLD_AGENT_CONTROL_RUNTIME_LEGACY_ERP_BRIDGE_ENABLED: ${CLOUDMOLD_AGENT_CONTROL_RUNTIME_LEGACY_ERP_BRIDGE_ENABLED:-false}
      # The BPM dependency is packaged through the isolated Maven profile. Its
      # Agent Control adapter remains fail-closed unless explicitly enabled.
      CLOUDMOLD_AGENT_APPROVAL_WORKFLOW_ENABLED: ${CLOUDMOLD_AGENT_APPROVAL_WORKFLOW_ENABLED:-false}
      CLOUDMOLD_AI_OPERATIONS_TEMPORAL_ENABLED: ${CLOUDMOLD_AI_OPERATIONS_TEMPORAL_ENABLED:-false}
      CLOUDMOLD_AI_OPERATIONS_TEMPORAL_SEED_ENABLED: ${CLOUDMOLD_AI_OPERATIONS_TEMPORAL_ENABLED:-false}
      CLOUDMOLD_AI_OPERATIONS_TEMPORAL_SEED_TENANTS: ${CLOUDMOLD_AI_OPERATIONS_TEMPORAL_SEED_TENANTS:-162}
      CLOUDMOLD_AI_OPERATIONS_SYNTHETIC_CONSUMER_MEMBER_USER_ID: ${CLOUDMOLD_AI_OPERATIONS_SYNTHETIC_CONSUMER_MEMBER_USER_ID:-286}
      CLOUDMOLD_TEMPORAL_TARGET: temporal:7233
      CLOUDMOLD_TEMPORAL_NAMESPACE: default
      CLOUDMOLD_TEMPORAL_TASK_QUEUE: cloudmold-ai-operations
      YUDAO_WEB_ADMIN_UI_URL: ${YUDAO_WEB_ADMIN_UI_URL:-http://127.0.0.1:5666/#}
      # The issuer and durable executor must share the same externally supplied
      # approval authority secret. Empty configuration keeps issuance fail-closed.
      CLOUDMOLD_SKILL_TASK_APPROVAL_HMAC_SECRET: ${CLOUDMOLD_SKILL_TASK_APPROVAL_HMAC_SECRET:-}
      # Keep the governed Compose data plane isolated from developer-local
      # providers that may register the same interfaces with another secret.
      CLOUDMOLD_RPC_GROUP: cloudmold-compose-internal
      CLOUDMOLD_ANALYTICS_LIVE_QUERY_ENABLED: "true"
      CLOUDMOLD_ANALYTICS_STAR_ROCKS_JDBC_URL: jdbc:mysql://yshopping-starrocks:9030/yshopping_ads?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=45000
      CLOUDMOLD_ANALYTICS_STAR_ROCKS_USERNAME: root
      CLOUDMOLD_DUBBO_REGISTRY: nacos://yudao-nacos:8848
      CLOUDMOLD_DUBBO_REGISTRY_GROUP: CLOUDMOLD_DUBBO
      # The 得物 V1 demo listings are published on the consumer YSHOPPING channel.
      CLOUDMOLD_APP_COMMERCE_CHANNEL_CODE: ${CLOUDMOLD_APP_COMMERCE_CHANNEL_CODE:-YSHOPPING}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: "123456"
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: yudao-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
      FLOWABLE_DATABASE_SCHEMA_UPDATE: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:-false}
      JAVA_OPTS: -Xms512m -Xmx1536m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom -Ddubbo.application.serialize-check-status=STRICT -Ddubbo.application.check-serializable=false -Ddubbo.hessian.allowNonSerializable=true
    secrets:
      - cloudmold_rpc_shared_secret
    ports:
      - "127.0.0.1:48080:48080"
      - "127.0.0.1:20880:20880"
    healthcheck:
      test: [ "CMD-SHELL", "test -s /tmp/cloudmold-rpc-ready && timeout 3 bash -c '</dev/tcp/127.0.0.1/20880'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      yudao_network:
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # Idempotent schema gate for the durable Skill Task control plane. The
  # executor cannot start until the versioned CloudMold migration succeeds.
  cloudmold-skill-task-migrator:
    profiles: [ "agent" ]
    image: mysql:8.0
    depends_on:
      yudao-mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: "123456"
    command:
      - /bin/sh
      - -ec
      - |
        mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-67.sql
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_skill_task_step' AND column_name='step_kind'")" = "0" ]; then
          mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-68.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_skill_task_instance' AND column_name='definition_sha256'")" = "0" ]; then
          mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-69.sql
        fi
        mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-93.sql
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_skill_task_instance' AND column_name='approval_scope_definition_closure_sha256'")" = "0" ]; then
          mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-107.sql
        fi
        mysql -hyudao-mysql -uroot ruoyi-vue-pro < /migration-108.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-112.sql
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_replenishment_conversion' AND column_name='source_system'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-113.sql
        fi
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-114.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-115.sql
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_ai_ops_temporal_run_binding' AND column_name='business_reference_id'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-116.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.check_constraints WHERE constraint_schema='ruoyi-vue-pro' AND constraint_name='ck_cm_inv_v3_command_type' AND check_clause LIKE '%INTRANSIT_ADD%'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-117.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_asn'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-118.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_ai_ops_temporal_schedule' AND column_name='input_strategy'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-119.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_event_outbox' AND index_name='idx_outbox_ai_ops_discovery'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-120.sql
        fi
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-121.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-122.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-123.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-124.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-125.sql
        mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-126.sql
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_replenishment_execution_proposal'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-127.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_crossborder_case'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-128.sql
        fi
        if [ "$(mysql -N -B -hyudao-mysql -uroot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ruoyi-vue-pro' AND table_name='cloudmold_bonded_customs_case'")" = "0" ]; then
          mysql --default-character-set=utf8mb4 -hyudao-mysql -uroot ruoyi-vue-pro < /migration-129.sql
        fi
    volumes:
      - ../../../yudao-cloud/sql/cloudmold/V20260718_67__durable_skill_task_executor.sql:/migration-67.sql:ro
      - ../../../yudao-cloud/cloudmold-module-skill-task/cloudmold-module-skill-task-server/src/main/resources/db/migration/V20260719_68__durable_skill_task_composition.sql:/migration-68.sql:ro
      - ../../../yudao-cloud/cloudmold-module-skill-task/cloudmold-module-skill-task-server/src/main/resources/db/migration/V20260719_69__skill_task_terminal_proof.sql:/migration-69.sql:ro
      - ../../../yudao-cloud/cloudmold-module-skill-task/cloudmold-module-skill-task-server/src/main/resources/db/migration/V20260725_93__skill_task_one_time_execution_permit.sql:/migration-93.sql:ro
      - ../../../yudao-cloud/cloudmold-module-skill-task/cloudmold-module-skill-task-server/src/main/resources/db/migration/V20260726_107__skill_task_child_approval_definition_scope.sql:/migration-107.sql:ro
      - ../../../yudao-cloud/cloudmold-module-ai-operations/cloudmold-module-ai-operations-server/src/main/resources/db/migration/V20260726_108__ai_operations_temporal_schedule.sql:/migration-108.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260726_112__dewu_agent_approval_operating_principal.sql:/migration-112.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260727_113__replenishment_execution_tracking.sql:/migration-113.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260727_114__canonical_procurement_first_slice.sql:/migration-114.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260727_115__canonical_fulfillment_exception.sql:/migration-115.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_116__temporal_run_binding_business_reference.sql:/migration-116.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_117__inventory_v3_intransit_and_quality_release_commands.sql:/migration-117.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_118__canonical_inbound_asn_receipt_putaway.sql:/migration-118.sql:ro
      - ../../../yudao-cloud/cloudmold-module-ai-operations/cloudmold-module-ai-operations-server/src/main/resources/db/migration/V20260729_119__managed_workflow_daily_automation.sql:/migration-119.sql:ro
      - ../../../yudao-cloud/cloudmold-module-ai-operations/cloudmold-module-ai-operations-server/src/main/resources/db/migration/V20260729_120__ai_operations_outbox_discovery.sql:/migration-120.sql:ro
      - ../../../yudao-cloud/cloudmold-module-ai-operations/cloudmold-module-ai-operations-server/src/main/resources/db/migration/V20260729_121__ai_operations_daily_dispatch_observation.sql:/migration-121.sql:ro
      - ../../../yudao-cloud/cloudmold-module-ai-operations/cloudmold-module-ai-operations-server/src/main/resources/db/migration/V20260729_122__automation_candidate_event_provenance.sql:/migration-122.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_123__canonical_supplier_sourcing.sql:/migration-123.sql:ro
      - ../../../yudao-cloud/cloudmold-module-finance/cloudmold-module-finance-server/src/main/resources/db/migration/V20260729_124__canonical_finance_close.sql:/migration-124.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_125__canonical_growth_experiment.sql:/migration-125.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_126__community_content_moderation_status_width.sql:/migration-126.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_127__replenishment_execution_proposal.sql:/migration-127.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260729_128__canonical_crossborder_direct_mail_v1.sql:/migration-128.sql:ro
      - ../../../yudao-cloud/sql/cloudmold/V20260730_129__canonical_bonded_customs_lifecycle_v1.sql:/migration-129.sql:ro
    networks:
      - yudao_network

  # Development Temporal authority. Production deploys temporalio/server with
  # independently managed persistence; auto-setup is intentionally local-only.
  temporal:
    profiles: [ "agent" ]
    image: temporalio/auto-setup:1.29.6
    container_name: cloudmold-temporal
    restart: unless-stopped
    depends_on:
      yudao-mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PWD: "123456"
      MYSQL_SEEDS: yudao-mysql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: [ "CMD-SHELL", "temporal operator cluster health --address temporal:7233 >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - yudao_network

  temporal-ui:
    profiles: [ "agent" ]
    image: temporalio/ui:2.52.1
    container_name: cloudmold-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:5666
    ports:
      - "127.0.0.1:8233:8080"
    networks:
      - yudao_network

  # Persistent business workflow executor. DeerFlow/MCP submit governed work
  # here; steps, leases, checkpoints, retries and results remain in MySQL.
  cloudmold-skill-task-executor:
    profiles: [ "agent" ]
    build:
      context: ../../../yudao-cloud/cloudmold-module-skill-task/cloudmold-module-skill-task-server
    image: cloudmold/skill-task-executor:local
    container_name: cloudmold-skill-task-executor
    restart: unless-stopped
    depends_on:
      yudao-nacos:
        condition: service_healthy
      cloudmold-skill-task-migrator:
        condition: service_completed_successfully
    environment:
      CLOUDMOLD_DB_URL: jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      CLOUDMOLD_DB_USERNAME: root
      CLOUDMOLD_DB_PASSWORD: "123456"
      CLOUDMOLD_SKILL_REGISTRY_ROOT: /app/skills
      CLOUDMOLD_SKILL_WORKER_ENABLED: ${CLOUDMOLD_SKILL_WORKER_ENABLED:-true}
      CLOUDMOLD_SKILL_TASK_APPROVAL_HMAC_SECRET: ${CLOUDMOLD_SKILL_TASK_APPROVAL_HMAC_SECRET:-}
      CLOUDMOLD_RPC_GROUP: cloudmold-compose-internal
      # Cross-domain KPI reads query the governed StarRocks role mart and can
      # legitimately take longer than ordinary OLTP capability calls.
      CLOUDMOLD_RPC_TIMEOUT_MILLIS: "45000"
      CLOUDMOLD_DUBBO_REGISTRY: nacos://yudao-nacos:8848
      CLOUDMOLD_DUBBO_REGISTRY_GROUP: CLOUDMOLD_DUBBO
      JAVA_OPTS: -Xms192m -Xmx512m -Dfile.encoding=UTF-8 -Ddubbo.application.migration.step=FORCE_INTERFACE -Ddubbo.application.serialize-check-status=STRICT -Ddubbo.application.check-serializable=false -Ddubbo.hessian.allowNonSerializable=true
    secrets:
      - cloudmold_rpc_shared_secret
    volumes:
      - ../../skills:/app/skills:ro
    ports:
      - "127.0.0.1:20882:20882"
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # One-shot governed consumer used by Skills. Run with:
  # docker compose run --rm cloudmold-agent-executor --list-capabilities
  cloudmold-agent-executor:
    profiles: [ "agent" ]
    build:
      context: ../../../yudao-cloud/cloudmold-agent-executor
    image: cloudmold/agent-executor:local
    depends_on:
      yudao-nacos:
        condition: service_healthy
      yudao-provider:
        condition: service_healthy
      cloudmold-skill-task-executor:
        condition: service_healthy
      yudao-redis:
        condition: service_started
    environment:
      CLOUDMOLD_RPC_GROUP: cloudmold-compose-internal
      CLOUDMOLD_DUBBO_REGISTRY: nacos://yudao-nacos:8848
      CLOUDMOLD_DUBBO_REGISTRY_GROUP: CLOUDMOLD_DUBBO
      SPRING_DATA_REDIS_HOST: yudao-redis
      SPRING_DATA_REDIS_PORT: "6379"
      # The capability group is the governance boundary. Interface-first avoids
      # loading metadata from unrelated developer-local applications that once
      # exported the same interface names into the shared Nacos instance.
      JAVA_OPTS: -Xms128m -Xmx384m -Dfile.encoding=UTF-8 -Ddubbo.application.migration.step=FORCE_INTERFACE -Ddubbo.application.serialize-check-status=STRICT -Ddubbo.application.check-serializable=false -Ddubbo.hessian.allowNonSerializable=true
    secrets:
      - cloudmold_rpc_shared_secret
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  # Long-lived northbound MCP adapter. Direct capability invocation is READ-only;
  # its fixed R1 command tools submit work to the durable Skill Task plane.
  cloudmold-hsf-mcp-server:
    profiles: [ "agent" ]
    build:
      context: ../../../yudao-cloud/cloudmold-hsf-mcp-server
    image: cloudmold/hsf-mcp-server:local
    container_name: cloudmold-hsf-mcp-server
    restart: unless-stopped
    depends_on:
      yudao-nacos:
        condition: service_healthy
      yudao-provider:
        condition: service_healthy
      cloudmold-skill-task-executor:
        condition: service_healthy
    environment:
      CLOUDMOLD_RPC_GROUP: cloudmold-compose-internal
      CLOUDMOLD_DUBBO_REGISTRY: nacos://yudao-nacos:8848
      CLOUDMOLD_DUBBO_REGISTRY_GROUP: CLOUDMOLD_DUBBO
      CLOUDMOLD_MCP_PORT: "49090"
      JAVA_OPTS: -Xms128m -Xmx384m -Dfile.encoding=UTF-8 -Ddubbo.application.migration.step=FORCE_INTERFACE -Ddubbo.application.serialize-check-status=STRICT -Ddubbo.application.check-serializable=false -Ddubbo.hessian.allowNonSerializable=true
    secrets:
      - cloudmold_rpc_shared_secret
      - cloudmold_mcp_bearer_token
    volumes:
      # Read-only governed analytics data product; no source code or credentials.
      - ../../../cloudmold-commerce-analytics:/app/cloudmold-commerce-analytics:ro
    ports:
      - "127.0.0.1:49090:49090"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/49090'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  yudao-redis:
    image: redis:6.2
    container_name: yudao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  yudao-mysql:
    image: mysql:8.0
    container_name: yudao-mysql
    restart: unless-stopped
    command: >
      --max_allowed_packet=209715200
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --server-id=1001
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --binlog-expire-logs-seconds=604800
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  yudao-starrocks:
    image: starrocks.docker.scarf.sh/starrocks/allin1-ubuntu
    container_name: yudao-starrocks
    restart: unless-stopped
    ports:
      - "9030:9030"  # FE query port
      - "8030:8030"  # FE http port
      - "8040:8040"  # BE http port
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data/starrocks:/opt/starrocks/data
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  # N8N 工作流自动化工具
  yudao-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: yudao-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"  # N8N web界面端口
    environment:
      # 基础配置
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai

      # 数据库配置 - 使用SQLite (默认)
      # N8N默认使用SQLite，无需额外配置

      # 执行配置
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=14400

      # 安全配置
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=n8n123456

      # 日志配置
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console

      # 其他配置
      - N8N_METRICS=false
      - N8N_DISABLE_UI=false
      - N8N_ENCRYPTION_KEY=n8n-encryption-key-yudao-2024
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - yudao_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  # NocoDB 低代码平台
  yudao-nocodb:
    image: nocodb/nocodb:latest
    container_name: yudao-nocodb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/nocodb:/usr/app/data
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  # PostgreSQL 数据库
  yudao-postgres:
    image: postgres:15
    container_name: yudao-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yudao_postgres
      POSTGRES_USER: yudao
      POSTGRES_PASSWORD: yudao123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yudao -d yudao_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yudao_network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

volumes:
  redis_data:
  postgres_data:

secrets:
  cloudmold_rpc_shared_secret:
    file: ${CLOUDMOLD_RPC_SECRET_FILE:-./data/secrets/cloudmold-rpc-shared-secret}
  cloudmold_mcp_bearer_token:
    file: ${CLOUDMOLD_MCP_TOKEN_FILE:-./data/secrets/cloudmold-mcp-bearer-token}

networks:
  yudao_network:
    driver: bridge
