version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    profiles: ["all", "schema"]
    command: --max_allowed_packet=209715200
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: dolphinscheduler
      MYSQL_ROOT_HOST: "%"
    #    volumes:
    ##      - mysql-test:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - dolphinscheduler

  dolphinscheduler-zookeeper:
    image: bitnami/zookeeper:3.6.2
    container_name: dolphinscheduler-zookeeper
#    ports:
#      - "2181:2181"
    profiles: ["all"]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,wchs,cons
    volumes:
      - dolphinscheduler-zookeeper:/bitnami/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/2181"]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - dolphinscheduler

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"        # PLAINTEXT 外部端口
      - "29092:29092"      # PLAINTEXT_EXTERNAL 外部端口
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=dolphinscheduler-zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - ./data/kafka:/bitnami/kafka
      - /etc/localtime:/etc/localtime
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"
    networks:
      - dolphinscheduler

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - dolphinscheduler

  doris:
    image: yagagagaga/doris-standalone:2.1.5
    platform: linux/arm64
    container_name: doris
    hostname: doris
    ports:
      - "8030:8030"  # HTTP 服务
      - "8040:8040"  # BE 端口
      - "9030:9030"  # MySQL 访问端口
    volumes:
      - ./doris/doris_fe_meta:/opt/doris/fe/meta
      - ./doris/doris_be_storage:/opt/doris/be/storage
#      - ./doris/scripts/fe.conf:/root/fe/conf/fe.conf
#      - ./doris/scripts/be.conf:/root/be/conf/be.conf
    environment:
      - DORIS_FE_IP=192.168.0.105
    networks:
      - dolphinscheduler
    command: >
      bash -c "sed -i 's/^priority_networks=.*/priority_networks=192.168.0.105\/24/' /opt/doris/fe/conf/fe.conf &&
               sed -i 's/^frontend_address=.*/frontend_address=192.168.0.105/' /opt/doris/fe/conf/fe.conf &&
               /opt/doris/bin/start_doris.sh --daemon &&
               tail -f /opt/doris/fe/log/fe.log"

  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:3.1.9
    env_file: .env
    profiles: ["schema"]
    command: [ tools/bin/upgrade-schema.sh ]
    depends_on:
      - mysql
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
      - "./mysql-connector-java-8.0.16.jar:/opt/dolphinscheduler/tools/libs/mysql-connector-java-8.0.16.jar"
    networks:
      - dolphinscheduler

  dolphinscheduler-api:
    image: apache/dolphinscheduler-api:3.1.9
    ports:
      - "12345:12345"
      - "25333:25333"
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
#      - ./scripts/dolphinscheduler_env.sh:/opt/dolphinscheduler/conf/dolphinscheduler_env.sh
      - "./mysql-connector-java-8.0.16.jar:/opt/dolphinscheduler/libs/mysql-connector-java-8.0.16.jar"
    networks:
      - dolphinscheduler

  dolphinscheduler-alert:
    image: apache/dolphinscheduler-alert-server:3.1.9
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:50053/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
#      - ./scripts/dolphinscheduler_env.sh:/opt/dolphinscheduler/conf/dolphinscheduler_env.sh
      - "./mysql-connector-java-8.0.16.jar:/opt/dolphinscheduler/libs/mysql-connector-java-8.0.16.jar"
    networks:
      - dolphinscheduler

  dolphinscheduler-master:
    image: apache/dolphinscheduler-master:3.1.9
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:5679/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
#      - ./scripts/dolphinscheduler_env.sh:/opt/dolphinscheduler/conf/dolphinscheduler_env.sh
      - "./mysql-connector-java-8.0.16.jar:/opt/dolphinscheduler/libs/mysql-connector-java-8.0.16.jar"
    networks:
      - dolphinscheduler

  dolphinscheduler-worker:
    image: apache/dolphinscheduler-worker:3.1.9
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:1235/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - dolphinscheduler-worker-data:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
#      - ./scripts/dolphinscheduler_env.sh:/opt/dolphinscheduler/conf/dolphinscheduler_env.sh
      - "./mysql-connector-java-8.0.16.jar:/opt/dolphinscheduler/libs/mysql-connector-java-8.0.16.jar"
    networks:
      - dolphinscheduler

