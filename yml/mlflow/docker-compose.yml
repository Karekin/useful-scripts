version: "3.8"

services:
  mlflow_postgres:
    image: postgres:15
    container_name: mlflow_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  mlflow_minio:
    image: minio/minio
    container_name: mlflow_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 控制台
    volumes:
      - ./data/minio/data:/data
      - ./data/minio/config:/root/.minio

  mlflow:
    image: burakince/mlflow:latest
    container_name: mlflow_server
    restart: always
    depends_on:
      - mlflow_postgres
      - mlflow_minio
    environment:
      # 只需要配置 S3 相关的环境变量，MLflow 会用它们访问 MinIO
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"
      MLFLOW_S3_ENDPOINT_URL: "http://mlflow_minio:9000"
    command: >
      mlflow server
        --backend-store-uri postgresql://mlflow:mlflow@mlflow_postgres:5432/mlflow
        --default-artifact-root s3://mlflow-artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "5001:5000"
